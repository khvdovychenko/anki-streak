name: Update stats and nag

on:
  schedule:
    # Times are UTC. remind.py works in Dublin time, so these cover the evening
    # both in winter (UTC+0) and summer (UTC+1).
    - cron: "17 7,11,15,17,18,19,20,21,22,23 * * *"
  workflow_dispatch:
    inputs:
      test_reminder:
        description: "Send a test notification right now"
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: update
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      - name: Download collection from AnkiWeb
        env:
          ANKI_USERNAME: ${{ secrets.ANKI_USERNAME }}
          ANKI_PASSWORD: ${{ secrets.ANKI_PASSWORD }}
        run: python collector/sync.py

      - name: Build analytics
        run: python collector/analyze.py

      - name: Send reminders
        env:
          PUSH_CONFIG: ${{ secrets.PUSH_CONFIG }}
          GMAIL_USER: ${{ secrets.GMAIL_USER }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
          EMAIL_TO: ${{ secrets.EMAIL_TO }}
          APP_URL: https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}/
          TEST_REMINDER: ${{ inputs.test_reminder }}
        run: python collector/remind.py

      - name: Save results
        run: |
          rm -rf data/anki
          git config user.name "anki-streak-bot"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A docs/data data
          git diff --cached --quiet || git commit -m "Update stats $(date -u +%F\ %H:%M)"
          git push
