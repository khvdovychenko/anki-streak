name: Update stats and nag

on:
  schedule:
    # Wakes up every hour (UTC). collector/should_run.py then checks your local
    # time and only syncs when it matters, so this works in any time zone.
    - cron: "17 * * * *"
  workflow_dispatch:
    inputs:
      test_reminder:
        description: "Send a test notification right now"
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: update
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    env:
      # Optional repository variables (Settings → Secrets and variables → Actions → Variables)
      TIMEZONE: ${{ vars.TIMEZONE }}
      REMINDER_HOURS: ${{ vars.REMINDER_HOURS }}
      EMAIL_REMINDERS: ${{ vars.EMAIL_REMINDERS }}
      DAY_START_HOUR: ${{ vars.DAY_START_HOUR }}
      DAILY_GOAL: ${{ vars.DAILY_GOAL }}
    steps:
      - uses: actions/checkout@v4

      - name: Is it time?
        id: gate
        run: python3 collector/should_run.py

      - uses: actions/setup-python@v5
        if: steps.gate.outputs.run == 'true'
        with:
          python-version: "3.12"
          cache: pip

      - name: Install
        if: steps.gate.outputs.run == 'true'
        run: pip install -r requirements.txt

      - name: Download collection from AnkiWeb
        if: steps.gate.outputs.run == 'true'
        env:
          ANKI_USERNAME: ${{ secrets.ANKI_USERNAME }}
          ANKI_PASSWORD: ${{ secrets.ANKI_PASSWORD }}
        run: python collector/sync.py

      - name: Build analytics
        if: steps.gate.outputs.run == 'true'
        run: python collector/analyze.py

      - name: Send reminders
        if: steps.gate.outputs.run == 'true'
        env:
          PUSH_CONFIG: ${{ secrets.PUSH_CONFIG }}
          GMAIL_USER: ${{ secrets.GMAIL_USER }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
          EMAIL_TO: ${{ secrets.EMAIL_TO }}
          APP_URL: https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}/
          TEST_REMINDER: ${{ inputs.test_reminder }}
        run: python collector/remind.py

      - name: Save results
        if: steps.gate.outputs.run == 'true'
        run: |
          rm -rf data/anki
          git config user.name "anki-streak-bot"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A docs/data data
          git diff --cached --quiet || git commit -m "Update stats $(date -u +%F\ %H:%M)"
          git push
