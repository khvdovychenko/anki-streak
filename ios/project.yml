# Generates Cinder.xcodeproj with XcodeGen: `xcodegen generate` in this folder.
name: Cinder
options:
  bundleIdPrefix: com.khrystyna
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "1.0"
    CURRENT_PROJECT_VERSION: "1"
    CODE_SIGN_STYLE: Automatic
    DEVELOPMENT_TEAM: ""  # set to your team ID (Xcode → Settings → Accounts)
    TARGETED_DEVICE_FAMILY: "1"
targets:
  Cinder:
    type: application
    platform: iOS
    sources: [Cinder, Shared]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.khrystyna.cinder
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        GENERATE_INFOPLIST_FILE: YES
    info:
      path: Cinder/Info.plist
      properties:
        CFBundleDisplayName: Cinder
        NSSupportsLiveActivities: true
        UILaunchScreen: {}
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]
        LSApplicationQueriesSchemes: [anki]
        CFBundleURLTypes:
          - CFBundleURLName: com.khrystyna.cinder
            CFBundleURLSchemes: [cinder]
    dependencies:
      - target: CinderWidget
  CinderWidget:
    type: app-extension
    platform: iOS
    sources: [CinderWidget, Shared]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.khrystyna.cinder.widget
        GENERATE_INFOPLIST_FILE: YES
    info:
      path: CinderWidget/Info.plist
      properties:
        CFBundleDisplayName: Cinder
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
    dependencies:
      - sdk: WidgetKit.framework
      - sdk: SwiftUI.framework
